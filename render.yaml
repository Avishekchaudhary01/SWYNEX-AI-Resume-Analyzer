services:
  - type: web
    name: swynex-ai-resume-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swynex-resume-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        fromService:
          name: swynex-ai-resume-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: swynex-ai-resume-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: swynex-ai-resume-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: swynex-resume-db
    databaseName: swynex_resume_analyzer
    user: swynex_app
    plan: free
    postgresMajorVersion: "17"
